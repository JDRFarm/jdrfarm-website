# Netlify Configuration for JDR Website
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # No build command needed - static HTML site
  command = ""
  # Publish the root directory
  publish = "."

# Redirect rules
[[redirects]]
  # Redirect www to non-www (or vice versa)
  from = "https://www.jdrfarm.com/*"
  to = "https://jdrfarm.com/:splat"
  status = 301
  force = true

[[redirects]]
  # Force HTTPS
  from = "http://jdrfarm.com/*"
  to = "https://jdrfarm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.jdrfarm.com/*"
  to = "https://jdrfarm.com/:splat"
  status = 301
  force = true

# Headers for better security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Cache static assets for 1 year
    
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Custom 404 page (optional - create 404.html if needed)
# [[redirects]]
#   from = "/*"
#   to = "/404.html"
#   status = 404

# Environment (optional)
[context.production.environment]
  NODE_ENV = "production"

# Deploy notifications (optional)
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = true
